name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - run: npm run android:add
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b1220' --splashBackgroundColor '#0b1220'
      - run: npm run apk

      - uses: actions/upload-artifact@v4
        with:
          name: relic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
